<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PAL Decoder — stage 1 demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #eee; background: #111; }
    h1 { font-size: 1.2rem; margin: 0 0 1rem; }
    h2 { font-size: 0.9rem; margin: 1.2rem 0 0.4rem; color: #aaa; font-weight: normal; }
    .row { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; }
    canvas { image-rendering: pixelated; background: #000; border: 1px solid #333; }
    .img { max-width: 480px; height: auto; aspect-ratio: 4 / 3; }
    #wave { width: 100%; height: 220px; display: block; }
    code { background: #222; padding: 0.1rem 0.3rem; border-radius: 3px; }
    .stat { font-size: 0.9rem; color: #bbb; margin-top: 0.4rem; }
  </style>
</head>
<body>
  <h1>PAL Decoder — stage 1</h1>
  <p>75% EBU colour bars → encoder → composite (4×F<sub>sc</sub>) → notch decoder → RGB.</p>

  <div class="row">
    <div class="col">
      <h2>Source (720×576)</h2>
      <canvas id="src" class="img"></canvas>
    </div>
    <div class="col">
      <h2>Decoded (notch)</h2>
      <canvas id="out" class="img"></canvas>
    </div>
    <div class="col">
      <h2>Round-trip PSNR</h2>
      <div class="stat">whole image: <span id="psnr-all">…</span></div>
      <div class="stat">body only (±8 px margin): <span id="psnr-body">…</span></div>
    </div>
  </div>

  <h2>Composite waveform</h2>
  <div class="row" style="align-items: center; gap: 0.75rem; margin-bottom: 0.4rem;">
    <input type="range" id="line" style="flex: 1; min-width: 300px;">
    <span id="line-label" class="stat" style="min-width: 18ch;">…</span>
  </div>
  <canvas id="wave" width="1920" height="220"></canvas>

  <script type="module" src="./src/demo.js"></script>
</body>
</html>
